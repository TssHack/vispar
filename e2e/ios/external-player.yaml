# #91: on the player's error screen, a toast and the "play with…" sheet must show over the player.
appId: com.fazli.vispar
---
- runFlow: start.yaml
- openLink: "vispar://player?url=http%3A%2F%2F127.0.0.1%3A9%2Fnone.mp4&q=720p&title=Test&type=movie&id=36180"
# iOS asks before opening a custom-scheme link.
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "کپی جزئیات خطا"
    timeout: 90000
- takeScreenshot: 02-player-error
# A toast raised inside the player.
- tapOn: "کپی جزئیات خطا"
- takeScreenshot: 03-toast
- assertVisible: "جزئیات خطا کپی شد"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "پخش با پلیر دیگر"
- waitForAnimationToEnd
- takeScreenshot: 04-after-tap
- assertVisible: "پخش با…"
