# #91: a toast raised in the player ("لینک کپی شد") must be visible over it.
appId: com.fazli.vispar
---
- runFlow: start.yaml
- openLink: "vispar://player?url=https%3A%2F%2Fcommondatastorage.googleapis.com%2Fgtv-videos-bucket%2Fsample%2FBigBuckBunny.mp4&q=720p&title=Test&type=movie&id=36180"
# iOS asks before opening a custom-scheme link.
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "گزینه‌های بیشتر"
    timeout: 60000
- tapOn: "گزینه‌های بیشتر"
- tapOn: "کپی لینک"
- takeScreenshot: 04-toast
- assertVisible: "لینک کپی شد"
