version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Expo and React Native versions move together with the SDK: upgrade those deliberately.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Expo pins these to an exact version per SDK. Move them only with `npx expo install --fix`.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-svg
      - dependency-name: '@react-native-async-storage/async-storage'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
